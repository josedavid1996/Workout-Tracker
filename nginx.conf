map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that isn't a real static file resolves to
    # index.html so react-router can handle client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to the self-hosted Supabase gateway on the Docker
    # host, so the browser never calls Supabase directly: no mixed content
    # or CORS when the app is served over https (e.g. through a tunnel).
    # `host.docker.internal` is mapped in docker-compose.yml.
    location ~ ^/(auth|rest|storage|functions|realtime|graphql)/v1/ {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Realtime runs over WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        client_max_body_size 50m;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
